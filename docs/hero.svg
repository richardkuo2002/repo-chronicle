<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="880" height="260" rx="12" fill="#0d1117"/>

  <!-- commit graph -->
  <line x1="90" y1="40" x2="90" y2="220" stroke="#30363d" stroke-width="3"/>
  <path d="M 90 90 C 140 90 140 90 140 130 C 140 170 140 170 90 170" fill="none" stroke="#30363d" stroke-width="3"/>
  <circle cx="90" cy="50" r="9" fill="#30363d"/>
  <circle cx="90" cy="90" r="9" fill="#e3b341"/>
  <circle cx="140" cy="130" r="9" fill="#e3b341"/>
  <circle cx="90" cy="170" r="9" fill="#30363d"/>
  <circle cx="90" cy="210" r="9" fill="#e3b341"/>
  <text x="120" y="55" fill="#484f58" font-size="13">a1f9c02</text>
  <text x="120" y="95" fill="#e3b341" font-size="13">7d3e8b1</text>
  <text x="170" y="135" fill="#e3b341" font-size="13">c92a4f7</text>
  <text x="120" y="175" fill="#484f58" font-size="13">5b06d9e</text>
  <text x="120" y="215" fill="#e3b341" font-size="13">f48c1a3</text>
  <text x="90" y="245" fill="#8b949e" font-size="13" font-family="-apple-system, 'Segoe UI', sans-serif" text-anchor="start">git history</text>

  <!-- arrow -->
  <line x1="300" y1="130" x2="420" y2="130" stroke="#1f6feb" stroke-width="3" stroke-linecap="round"/>
  <path d="M 420 130 l -14 -9 M 420 130 l -14 9" stroke="#1f6feb" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="360" y="112" fill="#79c0ff" font-size="13" font-family="-apple-system, 'Segoe UI', sans-serif" text-anchor="middle">match keyword</text>

  <!-- context pack document -->
  <rect x="460" y="30" width="330" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="480" y="62" fill="#c9d1d9" font-size="15" font-weight="bold"># context-pack.md</text>
  <text x="480" y="94" fill="#8b949e" font-size="13">## relevant commits</text>
  <text x="480" y="116" fill="#e3b341" font-size="13">- 7d3e8b1  - c92a4f7  - f48c1a3</text>
  <text x="480" y="148" fill="#8b949e" font-size="13">## files that change together</text>
  <rect x="480" y="160" width="180" height="8" rx="4" fill="#30363d"/>
  <rect x="480" y="176" width="140" height="8" rx="4" fill="#30363d"/>
  <text x="480" y="210" fill="#8b949e" font-size="13">## related tests</text>
  <text x="625" y="245" fill="#8b949e" font-size="13" font-family="-apple-system, 'Segoe UI', sans-serif" text-anchor="middle">commit-evidenced context pack</text>
</svg>
