name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, zero third-party deps)
        run: pip install -e .

      - name: Run test suite (includes the fixture-repository tests)
        run: python -m unittest discover -s tests -v

      - name: CLI --help smoke test
        run: |
          repo-chronicle --help
          repo-chronicle explain --help

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
